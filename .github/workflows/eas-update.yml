name: EAS Update (OTA)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update:
    name: Lint, Typecheck & Update with EAS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish EAS Update
        run: npx eas-cli@latest update --channel production --environment production --non-interactive --message "Update ${{ github.sha }}"
